[workspace]
members = [".", "crates/muse-types", "crates/muse-geom", "crates/muse-spec", "crates/muse-ops", "crates/muse-validate", "crates/muse-cli"]
exclude = ["experiments/incremental-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "MUSE compiler and execution engine"
license = "MIT OR Apache-2.0"

# Direct Rust dependencies are governed here. Packages may only use `workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cel = "0.14.5"
clap = { version = "4.6.7", features = ["derive"] }
divan = "0.1.21"
fastnoise-lite = { version = "1.1.1", default-features = false, features = ["f64", "std"] }
glam = { version = "0.33.8", features = ["serde"] }
hexasphere = "19.0.0"
insta = "1.48.0"
petgraph = "0.8.3"
proptest = "1.11.0"
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[package]
name = "muse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
cel.workspace = true
clap.workspace = true
fastnoise-lite.workspace = true
glam.workspace = true
hexasphere.workspace = true
petgraph.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
divan.workspace = true
insta.workspace = true
proptest.workspace = true

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.ci]
inherits = "dev"
incremental = false
opt-level = 0
codegen-units = 256
debug = "line-tables-only"

[profile.ci-release]
inherits = "release"
opt-level = 1
incremental = false
codegen-units = 256
lto = false
debug = false

[profile.coz]
inherits = "release"
opt-level = 2
incremental = false
codegen-units = 256
lto = false
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
