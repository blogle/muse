[package]
name = "muse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A minimal Rust crate bootstrap"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.ci]
inherits = "dev"
incremental = false
opt-level = 0
codegen-units = 256
debug = "line-tables-only"

[profile.ci-release]
inherits = "release"
opt-level = 1
incremental = false
codegen-units = 256
lto = false
debug = false

[profile.production]
inherits = "release"
opt-level = 3
incremental = false
codegen-units = 1
lto = "thin"
debug = false
strip = "symbols"
